<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz on Indian History</title>
    <link rel="stylesheet" href="./ASSETS/css/style.css">
</head>
<body>
    <header>
        <nav>
            <a href="./index.html">Home</a>
            <a href="./howto.html">How to Play</a>
        </nav>
    </header>

    <main class="container">
        <!-- Landing Section -->
        <section id="welcome-card">
            <h1>Quiz on Indian History</h1>
            <p>Test your knowledge of Indian history across ancient, medieval, and modern eras!</p>
        </section>
            <button id="start-btn" type="button">Start Quiz</button>

        <!-- Dynamic Quiz Section -->
        <section id="quiz-card" class="hidden">
            <div id="quiz-header">
                <span id="question-tracker">Question 1 of 10</span>
                <span id="score-tracker">Score: 0</span>
            </div>

            <h2 id="question-text">Question text will load here...</h2>
            <div id="options-container"></div>

            <div id="feedback" class="hidden"></div>

            <div class="navigation-controls">
                <button id="next-btn" class="hidden" type="button">Next Question</button>
                <button id="submit-btn" class="hidden" type="button">Submit Quiz</button>
            </div>
        </section>

        <!-- Final Results Section -->
        <section id="results-card" class="hidden">
            <h2>Quiz Results</h2>
            <p id="final-score"></p>
            <div id="summary-container"></div>
            <button id="restart-btn" type="button">Try Again</button>
        </section>
    </main>

    <!-- Scripts placed in correct order before closing body tag -->
    <script src="./js/questions.js"></script>
    <script src="./js/app.js"></script>
</body>
</html>
